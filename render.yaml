services:
  - type: web
    name: platform-ticket-backend
    runtime: python
    rootDir: platform-ticket-backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "24"
      - key: RAZORPAY_KEY_ID
        value: test_key
      - key: RAZORPAY_KEY_SECRET
        value: test_secret
      - key: AWS_ACCESS_KEY_ID
        value: test
      - key: AWS_SECRET_ACCESS_KEY
        value: test
      - key: AWS_S3_BUCKET
        value: test
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: development
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
